openapi: "3.0.3"
info:
  title: Do It - Goal Tracker API
  description: |
    RESTful API for managing personal goals in the Do It application.
    All endpoints are Next.js App Router route handlers under `/api/goals`.
    Used only when `NEXT_PUBLIC_STORAGE_MODE=production`.
  version: "1.0.0"

servers:
  - url: /api
    description: Next.js API routes (same origin)

tags:
  - name: goals
    description: Goal CRUD and status management

paths:
  /goals:
    get:
      summary: List all goals
      description: Returns all goals, optionally filtered by status.
      operationId: listGoals
      tags: [goals]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, completed]
          description: Filter goals by status. Omit to return all goals.
      responses:
        "200":
          description: Array of goals
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Goal"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create a new goal
      operationId: createGoal
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "201":
          description: Goal created successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /goals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Goal UUID

    get:
      summary: Get a single goal
      operationId: getGoal
      tags: [goals]
      responses:
        "200":
          description: Goal found
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Goal"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      summary: Update a goal (edit fields or change status)
      description: |
        Partial update. Supports:
        - Editing `title` and/or `endDate`
        - Completing a goal: set `status` to `completed` (sets `completedAt` automatically)
        - Restoring a goal: set `status` to `active` (clears `completedAt`)
      operationId: updateGoal
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalRequest"
      responses:
        "200":
          description: Goal updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Permanently delete a goal
      operationId: deleteGoal
      tags: [goals]
      responses:
        "204":
          description: Goal deleted (no body)
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    Goal:
      type: object
      required: [id, title, endDate, status, completedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        title:
          type: string
          maxLength: 100
          example: "Finish UI Design System"
        endDate:
          type: string
          format: date
          description: ISO date (YYYY-MM-DD)
          example: "2026-05-25"
        status:
          type: string
          enum: [active, completed]
          example: "active"
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: ISO datetime when completed; null if active
          example: null
        createdAt:
          type: string
          format: date-time
          description: ISO datetime when created
          example: "2026-05-08T10:00:00.000Z"

    CreateGoalRequest:
      type: object
      required: [title, endDate]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: "Complete 10km Run"
        endDate:
          type: string
          format: date
          description: Must be today or a future date (YYYY-MM-DD)
          example: "2026-06-01"

    UpdateGoalRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: "Complete 10km Run (updated)"
        endDate:
          type: string
          format: date
          example: "2026-06-15"
        status:
          type: string
          enum: [active, completed]
          description: |
            Set to `completed` to complete the goal (sets completedAt).
            Set to `active` to restore the goal (clears completedAt).

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Human-readable error description
          example: "Title is required (max 100 characters)"

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "VALIDATION_ERROR"
            message: "End date must be today or in the future"

    NotFound:
      description: Goal not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "NOT_FOUND"
            message: "Goal not found"

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "INTERNAL_ERROR"
            message: "An unexpected error occurred. Please try again."
